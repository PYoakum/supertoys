# LLM Instructions for Creating Goals-CLI Compatible Goal Definitions
# Reference: goals-cli/schemas/goals.schema.json

purpose: |
  This document provides instructions for LLMs to create well-structured goal
  definitions that integrate with the goals-cli workstream. Goals are JSON
  documents that define objectives for AI workflow orchestration.

output_format:
  type: JSON
  schema_version: "1.0"
  file_extension: .json
  encoding: UTF-8

# =============================================================================
# DOCUMENT STRUCTURE
# =============================================================================

structure:
  required_fields:
    - version: "1.0"
    - goals: array of goal objects (minimum 1)

  optional_fields:
    - metadata: document metadata
    - globalContext: key-value pairs available to all goals

# =============================================================================
# METADATA SECTION
# =============================================================================

metadata:
  description: |
    Optional but recommended section providing context about the goals definition.

  fields:
    name:
      type: string
      description: Human-readable name for this goals definition
      example: "E-commerce Checkout Flow"

    description:
      type: string
      description: Brief explanation of what these goals accomplish
      example: "Implement a secure checkout process with payment integration"

    author:
      type: string
      description: Creator of the goals definition
      example: "development-team"

    created:
      type: string
      format: ISO 8601 datetime
      example: "2025-01-15T10:30:00Z"

    tags:
      type: array of strings
      description: Categorization tags for filtering and organization
      example: ["backend", "payments", "security", "api"]

# =============================================================================
# GOAL DEFINITION
# =============================================================================

goal:
  required_fields:
    id:
      type: string
      pattern: "^[a-z][a-z0-9-]*$"
      description: |
        Unique identifier in kebab-case. Must start with a lowercase letter,
        followed by lowercase letters, numbers, or hyphens.
      examples:
        - "setup-database"
        - "implement-auth-flow"
        - "create-api-endpoints"
      invalid_examples:
        - "Setup-Database"    # uppercase not allowed
        - "1-setup"           # cannot start with number
        - "setup_database"    # underscores not allowed

    objective:
      type: string
      min_length: 10
      description: |
        Clear, actionable statement of what should be accomplished.
        Should be specific enough to be measurable.
      guidelines:
        - Start with an action verb (Create, Implement, Configure, etc.)
        - Be specific about the expected outcome
        - Include enough context for the AI to understand the scope
        - Avoid vague language like "improve" or "enhance" without specifics
      examples:
        good:
          - "Create a REST API endpoint for user registration that validates email format and password strength"
          - "Configure PostgreSQL database with tables for users, products, and orders"
          - "Implement JWT-based authentication with refresh token rotation"
        bad:
          - "Make the app better"           # too vague
          - "Do auth"                       # not descriptive
          - "Fix bugs"                      # not specific

  optional_fields:
    priority:
      type: integer
      range: 1-10
      default: 5
      description: |
        Execution priority where 1 is highest and 10 is lowest.
        Goals with lower numbers are executed first when no dependencies exist.
      guidelines:
        - 1-3: Critical path items, blockers for other work
        - 4-6: Standard priority, normal workflow items
        - 7-10: Nice-to-have, can be deferred

    criteria:
      description: Success and acceptance criteria for the goal
      fields:
        success:
          type: array of strings
          description: |
            Conditions that define complete success. These are ideal outcomes
            that indicate the goal was fully achieved.
          example:
            - "All API endpoints return proper HTTP status codes"
            - "Unit tests achieve 80% code coverage"
            - "Documentation is complete with examples"

        acceptance:
          type: array of strings
          description: |
            Minimum requirements for the goal to be considered complete.
            These are the bare minimum criteria that must be met.
          example:
            - "API endpoint is accessible and returns valid JSON"
            - "Basic error handling is implemented"

        validation:
          type: enum
          values: ["manual", "automated", "hybrid"]
          default: "manual"
          description: |
            How success will be validated.
            - manual: Human review required
            - automated: Can be verified programmatically (tests, linting)
            - hybrid: Combination of automated checks and human review

    constraints:
      type: array of strings
      description: |
        Limitations, restrictions, or requirements that must be followed.
        These guide HOW the goal should be achieved.
      examples:
        - "Use TypeScript with strict mode enabled"
        - "Must be compatible with Node.js 18+"
        - "No external API calls allowed"
        - "Maximum response time of 200ms"
        - "Follow existing code style and patterns"

    dependencies:
      type: array of strings
      description: |
        IDs of goals that must complete before this goal can start.
        Creates an execution order based on goal relationships.
      guidelines:
        - Reference goals by their exact id
        - Avoid circular dependencies
        - Keep dependency chains shallow when possible
      example:
        - "setup-database"
        - "configure-environment"

    context:
      type: object (key-value pairs)
      description: |
        Goal-specific context information. Keys and values must be strings.
        This data is available during goal execution.
      examples:
        tool: "tablemaker"
        outputPath: "./reports/output.html"
        framework: "React"
        database: "PostgreSQL"

# =============================================================================
# GLOBAL CONTEXT
# =============================================================================

globalContext:
  description: |
    Key-value pairs available to all goals in the definition.
    Useful for shared configuration like project name, environment, paths.

  type: object (string keys, string values)

  common_keys:
    - projectName: Name of the project being worked on
    - targetEnvironment: development, staging, production
    - outputDir: Default output directory
    - language: Programming language being used
    - framework: Framework or library in use

# =============================================================================
# BEST PRACTICES
# =============================================================================

best_practices:
  goal_design:
    - Keep goals atomic and focused on a single outcome
    - Make objectives measurable and verifiable
    - Use dependencies to create logical execution order
    - Provide enough context for autonomous execution
    - Include constraints that prevent common mistakes

  naming_conventions:
    - Use descriptive, action-oriented ids
    - Group related goals with common prefixes (auth-login, auth-logout, auth-refresh)
    - Keep ids concise but meaningful

  criteria_guidelines:
    - Success criteria should be comprehensive
    - Acceptance criteria should be minimal viable requirements
    - Use "automated" validation when tests can verify the outcome
    - Use "hybrid" when both tests and human review are needed

  dependency_management:
    - Minimize dependency depth (avoid A -> B -> C -> D -> E chains)
    - Use dependencies only when there's a true execution order requirement
    - Consider parallel execution opportunities by avoiding unnecessary dependencies

  context_usage:
    - Use globalContext for project-wide settings
    - Use goal context for goal-specific overrides
    - Keep context values as strings (convert complex data if needed)

# =============================================================================
# EXAMPLE TEMPLATES
# =============================================================================

templates:
  minimal_goal:
    description: Simplest valid goal definition
    example: |
      {
        "version": "1.0",
        "goals": [
          {
            "id": "example-task",
            "objective": "Complete a simple example task with basic requirements"
          }
        ]
      }

  standard_goal:
    description: Typical goal with common fields
    example: |
      {
        "version": "1.0",
        "metadata": {
          "name": "Feature Implementation",
          "description": "Implement a new feature with tests",
          "tags": ["feature", "backend"]
        },
        "goals": [
          {
            "id": "implement-feature",
            "objective": "Create a user profile API endpoint that returns user data",
            "priority": 2,
            "criteria": {
              "success": [
                "Endpoint returns user profile JSON",
                "Proper authentication is required",
                "Unit tests pass with >80% coverage"
              ],
              "acceptance": [
                "Endpoint is accessible at /api/users/:id",
                "Returns 404 for non-existent users"
              ],
              "validation": "automated"
            },
            "constraints": [
              "Use existing database models",
              "Follow REST API conventions",
              "Include rate limiting"
            ],
            "context": {
              "endpoint": "/api/users/:id",
              "method": "GET"
            }
          }
        ]
      }

  multi_goal_with_dependencies:
    description: Multiple related goals with execution order
    example: |
      {
        "version": "1.0",
        "metadata": {
          "name": "Database Setup",
          "description": "Initialize database with schema and seed data"
        },
        "goals": [
          {
            "id": "create-schema",
            "objective": "Create database tables for users, products, and orders",
            "priority": 1,
            "criteria": {
              "success": ["All tables created with proper indexes"],
              "validation": "automated"
            }
          },
          {
            "id": "seed-data",
            "objective": "Populate database with initial test data",
            "priority": 2,
            "dependencies": ["create-schema"],
            "criteria": {
              "success": ["Test data inserted for all tables"],
              "validation": "automated"
            }
          },
          {
            "id": "verify-setup",
            "objective": "Run verification queries to confirm database setup",
            "priority": 3,
            "dependencies": ["seed-data"],
            "criteria": {
              "success": ["All verification queries pass"],
              "validation": "automated"
            }
          }
        ],
        "globalContext": {
          "database": "PostgreSQL",
          "environment": "development"
        }
      }

# =============================================================================
# COMMON MISTAKES TO AVOID
# =============================================================================

common_mistakes:
  - mistake: "Using uppercase or underscores in goal IDs"
    correct: "Use lowercase kebab-case: my-goal-id"

  - mistake: "Vague objectives like 'Make it work'"
    correct: "Specific objectives: 'Create login endpoint that validates credentials and returns JWT'"

  - mistake: "Missing dependencies causing execution order issues"
    correct: "Explicitly declare dependencies when one goal requires another's output"

  - mistake: "Overly complex single goals"
    correct: "Break into smaller, focused goals with clear dependencies"

  - mistake: "Circular dependencies (A depends on B, B depends on A)"
    correct: "Restructure to have a clear execution order"

  - mistake: "Using non-string values in context"
    correct: "All context values must be strings"

  - mistake: "Priority confusion (thinking 10 is highest)"
    correct: "Priority 1 is highest, 10 is lowest"

# =============================================================================
# VALIDATION CHECKLIST
# =============================================================================

validation_checklist:
  - version field is "1.0"
  - goals array has at least one goal
  - Each goal has id and objective fields
  - Goal IDs match pattern ^[a-z][a-z0-9-]*$
  - Objectives are at least 10 characters
  - Priority values are integers 1-10 if specified
  - Dependencies reference existing goal IDs
  - No circular dependencies exist
  - Context values are all strings
  - Validation type is one of: manual, automated, hybrid
