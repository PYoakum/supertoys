# Default CGA Theme for Goals CLI TUI
#
# This theme uses the classic CGA 16-color palette.
# Color values can be:
#   - Color names: black, blue, green, cyan, red, magenta, brown, light_gray,
#                  dark_gray, light_blue, light_green, light_cyan, light_red,
#                  light_magenta, yellow, white
#   - CGA indices: 0-15

[meta]
name = "Default CGA"
description = "Classic CGA blue theme"
author = "Goals CLI"

# UI Color Assignments
# These define the semantic colors used throughout the UI

[ui.backgrounds]
normal = "blue"
panel = "black"
selected = "cyan"
header = "blue"
footer = "blue"
error = 54   # indigo (256-color mode)
success = "green"

[ui.foregrounds]
normal = "light_gray"
bright = "white"
dim = "dark_gray"
selected = "black"
title = "yellow"
accent = "light_cyan"
error = 99   # light indigo (256-color mode)
success = "light_green"
warning = "yellow"
highlight = "white"

[ui.borders]
normal = "light_gray"
active = "white"
dim = "dark_gray"

# Style Definitions
# These combine UI colors with text attributes (bold, dim, etc.)
# fg/bg values reference ui.foregrounds/ui.backgrounds keys or direct color names

[styles.panel]
fg = "fg_normal"
bg = "bg_panel"

[styles.header]
fg = "fg_title"
bg = "bg_header"
bold = true

[styles.footer]
fg = "fg_normal"
bg = "bg_footer"

[styles.selected]
fg = "fg_selected"
bg = "bg_selected"
bold = true

[styles.title]
fg = "fg_title"
bg = "bg_panel"
bold = true

[styles.dim]
fg = "fg_dim"
bg = "bg_panel"

[styles.accent]
fg = "fg_accent"
bg = "bg_panel"

[styles.bright]
fg = "fg_bright"
bg = "bg_panel"
bold = true

[styles.error]
fg = "fg_error"
bg = "bg_panel"
bold = true

[styles.success]
fg = "fg_success"
bg = "bg_panel"
bold = true

[styles.warning]
fg = "fg_warning"
bg = "bg_panel"

[styles.border]
fg = "border_normal"
bg = "bg_panel"

[styles.border_active]
fg = "border_active"
bg = "bg_panel"
