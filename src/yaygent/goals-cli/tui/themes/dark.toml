# Dark Theme for Goals CLI TUI
#
# A dark theme with muted colors and high contrast text

[meta]
name = "Dark"
description = "Dark theme with muted colors"
author = "Goals CLI"

[ui.backgrounds]
normal = "black"
panel = "black"
selected = "dark_gray"
header = "black"
footer = "black"
error = "red"
success = "green"

[ui.foregrounds]
normal = "light_gray"
bright = "white"
dim = "dark_gray"
selected = "white"
title = "light_cyan"
accent = "light_blue"
error = "light_red"
success = "light_green"
warning = "yellow"
highlight = "white"

[ui.borders]
normal = "dark_gray"
active = "light_gray"
dim = "dark_gray"

[styles.header]
fg = "fg_title"
bg = "bg_header"
bold = true

[styles.selected]
fg = "fg_selected"
bg = "bg_selected"
bold = true

[styles.title]
fg = "fg_title"
bg = "bg_panel"
bold = true
