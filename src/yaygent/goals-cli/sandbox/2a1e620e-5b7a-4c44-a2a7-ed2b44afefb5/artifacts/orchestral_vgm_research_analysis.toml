[[relevant_information]]
heading = "Early video game technology and computer chip music"
content = "Early video game music was limited to sounds of early sound chips, such as programmable sound generators (PSG) or FM synthesis chips. These limitations led to the chiptune style. The first game with continuous background soundtrack was Space Invaders (1978), while Rally-X (1980) featured the first continuous melodic background music."
relevance_score = 0.95

[[relevant_information]]
heading = "Modern Orchestral Development"
content = "With technological advances, video game music has grown to include a wider range of sounds and can change dynamically based on player actions. The popularity has created education opportunities, awards, and led to commercial sales and concert performances."
relevance_score = 0.9

[[relevant_information]]
heading = "Academic Study and Ludomusicology"
content = "Academic research on video game music began in the late 1990s, developing into 'ludomusicology' - a portmanteau of ludology and musicology. Karen Collins is noted as a prominent figure with her seminal work 'Game Sound: An Introduction to the History, Theory and Practice of Video Game Music and Sound Design' (2008)."
relevance_score = 0.85

[[relevant_information]]
heading = "Public Performance and Cultural Impact"
content = "Video game music has gained international recognition through symphonic concerts, starting with Koichi Sugiyama's 'Family Classic Concert' in 1987. Major orchestras like the Los Angeles Philharmonic and Czech National Symphony Orchestra now regularly perform video game music, with events like Video Games Live drawing large audiences."
relevance_score = 0.88

[[relevant_information]]
heading = "Education and Career Opportunities"
content = "Over 400 schools in the US offer video game design courses including sound and music design. Institutions like Berklee College of Music, Yale University, and NYU have introduced game music programs. The field has expanded to include roles like music supervisors, composers, and sound designers."
relevance_score = 0.82

