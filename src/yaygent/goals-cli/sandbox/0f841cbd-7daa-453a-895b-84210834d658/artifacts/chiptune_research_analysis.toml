[[relevant_information]]
heading = "Technology"
content = "Chiptune uses programmable sound generators with basic waveforms like pulse, square, triangle, and sawtooth waves. Game Boy uses two pulse channels and 4-bit waveform generator; Commodore 64's SID chip offers 3 channels with full duty cycle control, ring modulation, and adjustable resonance filters."
relevance_score = 0.95

[[relevant_information]]
heading = "Historical Origins"
content = "Chiptune began with 1970s arcade games like Gun Fight (1975) and Space Invaders (1978). Yellow Magic Orchestra pioneered sampling arcade sounds in 1978. FM synthesis introduction in early 1980s marked major advancement, with composers like Yuzo Koshiro creating influential soundtracks."
relevance_score = 0.9

[[relevant_information]]
heading = "Mainstream Adoption"
content = "After declining in 1990s, chiptune resurged in 2000s with artists like Beck, The Killers, and Perfume. The 2007 album '8-Bit Operators: The Music of Kraftwerk' reached #1 on CMJ charts. Modern artists like Kesha and Deadmau5 incorporate chiptune elements."
relevance_score = 0.85

[[relevant_information]]
heading = "Contemporary Scene"
content = "Modern chiptune emphasizes live performances and record releases, using tools like LittleSoundDJ for Game Boy. Events like Blip Festival and MAGFest's Chipspace foster community. Games like Shovel Knight and Undertale feature chiptune soundtracks."
relevance_score = 0.8

[[relevant_information]]
heading = "Tracker Chiptunes"
content = "Amiga tracker music (1987+) created chiptune subgenre using short looped waveforms instead of samples. Common 128-sample loops at 17kHz. Used in demoscene demos and crack intros for space efficiency."
relevance_score = 0.75

[[clarity_improvements]]
original = "The term is commonly used to refer to tracker format music using extremely basic and small samples that an old computer or console could produce (this is the original meaning of the term), as well as music that combines PSG sounds with modern musical styles."
improved = "Chiptune originally described tracker music using tiny samples that vintage computers could handle, but now also includes music that blends classic sound chip tones with contemporary genres."

[[clarity_improvements]]
original = "Due to the limited number of voices in early sound chips, one of the main challenges is to produce rich polyphonic music with them. The usual method to emulate it is via quick arpeggios, which is one of the most relevant features of chiptune music."
improved = "Early sound chips had few audio channels, making complex harmonies difficult. Composers solved this by using rapid arpeggios - quickly cycling through chord notes - which became a signature chiptune technique."