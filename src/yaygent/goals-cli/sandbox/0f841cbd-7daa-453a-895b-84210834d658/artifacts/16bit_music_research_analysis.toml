[[relevant_information]]
heading = "Early video game technology and computer chip music"
content = "Early video game music was limited to sounds of sound chips like programmable sound generators (PSG) or FM synthesis chips. The first continuous background soundtrack was Space Invaders (1978) with four descending chromatic bass notes. Rally-X (1980) featured the first continuous melodic background music."
relevance_score = 0.95

[[relevant_information]]
heading = "16-bit era developments"
content = "The Sega Genesis offered 6 channels of FM synthesis plus 4 PSG channels, while the Super NES brought digitized sound with 8 channels of sampled sounds at 16-bit resolution. Composers like Yuzo Koshiro created progressive techno-style compositions that set new standards for game music quality."
relevance_score = 0.98

[[relevant_information]]
heading = "Notable composers and their contributions"
content = "Key figures include Koichi Sugiyama (Dragon Quest), Nobuo Uematsu (Final Fantasy), Koji Kondo (Super Mario Bros., Zelda), Yuzo Koshiro (Streets of Rage), and many others who established video game music as a legitimate art form during the 8-bit and 16-bit eras."
relevance_score = 0.9

[[relevant_information]]
heading = "Technical limitations driving creativity"
content = "Limited polyphony (NES could only play 3 notes simultaneously) forced composers to create complex rapid sequences and use creative techniques to simulate more instruments. This led to the distinctive 'video game music genre' with pieces designed to loop indefinitely."
relevance_score = 0.88

[[relevant_information]]
heading = "Cultural impact and academic study"
content = "Video game music has spawned concert performances, CD releases, academic programs, and the field of ludomusicology. Public performances began with Koichi Sugiyama's concerts in 1987, leading to major orchestral events like Video Games Live."
relevance_score = 0.85

