[package]
name = "rs-store"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async and sync primitives
parking_lot = "0.12"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

[[bin]]
name = "rs-stor"
path = "src/main.rs"