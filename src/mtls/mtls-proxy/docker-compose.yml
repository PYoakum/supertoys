version: '3.8'

services:
  # mTLS Proxy
  mtls-proxy:
    build: .
    container_name: mtls-proxy
    ports:
      - "8443:8443"
    volumes:
      # Mount certificate directory
      - ./certs:/etc/mtls-proxy:ro
    command:
      - "--listen"
      - "0.0.0.0:8443"
      - "--upstream"
      - "http://upstream:8080"
      - "--server-cert"
      - "/etc/mtls-proxy/server-cert.pem"
      - "--server-key"
      - "/etc/mtls-proxy/server-key.pem"
      - "--client-ca"
      - "/etc/mtls-proxy/ca-cert.pem"
      - "--log-level"
      - "info"
    depends_on:
      - upstream
    networks:
      - proxy-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-x", "mtls-proxy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Example upstream service
  upstream:
    image: nginx:alpine
    container_name: upstream
    volumes:
      - ./examples/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - proxy-net
    restart: unless-stopped

networks:
  proxy-net:
    driver: bridge